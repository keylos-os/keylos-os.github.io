<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 380" width="1128" height="380" role="img" aria-label="Supply chain">
<style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .subtitle { font: 400 12px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .lbl { font: 600 12.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .sub { font: 400 11px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #374151; }
  .mono { font: 400 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2937; }
  .small { font: 400 10.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .grp { fill: none; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .grplbl { font: 600 11.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; letter-spacing: 0.04em; }
  .edge { fill: none; stroke: #374151; stroke-width: 1.4; }
  .edge.dash { stroke-dasharray: 5 4; }
  .elbl { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2937; }
  .elblbg { fill: #ffffff; opacity: 0.92; }
  .life { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 4; }
  .act { fill: #ffffff; stroke: #6b7280; stroke-width: 1; }
  .note { fill: #fffbea; stroke: #d6b656; stroke-width: 1; }
  .notetxt { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4a3b00; }
  .forbid { fill: #b91c1c; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect class="bg" x="0" y="0" width="1128" height="380"/>
<text class="title" x="24" y="34">Supply chain</text>
<text class="subtitle" x="24" y="54">From a pinned source tree to a page the kernel will execute</text>
<rect x="30" y="84" width="190" height="74" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>
<text class="lbl" x="125" y="111" text-anchor="middle">Source</text>
<text class="sub" x="125" y="127" text-anchor="middle">git tree → src:sha256</text>
<text class="sub" x="125" y="141" text-anchor="middle">tarball diff recorded</text>
<rect x="250" y="84" width="190" height="74" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>
<text class="lbl" x="345" y="111" text-anchor="middle">forge (hermetic)</text>
<text class="sub" x="345" y="127" text-anchor="middle">no network, build ≠ test</text>
<text class="sub" x="345" y="141" text-anchor="middle">drv:sha256 → output</text>
<path class="edge" d="M 220 121 L 250 121" marker-end="url(#ah)"/>
<rect x="470" y="84" width="190" height="74" rx="8" fill="#e8f7f1" stroke="#047857" stroke-width="1.6"/>
<text class="lbl" x="565" y="111" text-anchor="middle">Output gen</text>
<text class="sub" x="565" y="127" text-anchor="middle">content-addressed</text>
<text class="sub" x="565" y="141" text-anchor="middle">gen:fsv256</text>
<path class="edge" d="M 440 121 L 470 121" marker-end="url(#ah)"/>
<rect x="690" y="84" width="190" height="74" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>
<text class="lbl" x="785" y="111" text-anchor="middle">Rebuilders A·B·C</text>
<text class="sub" x="785" y="127" text-anchor="middle">realisation</text>
<text class="sub" x="785" y="141" text-anchor="middle">attestations (in-toto)</text>
<path class="edge" d="M 660 121 L 690 121" marker-end="url(#ah)"/>
<rect x="910" y="84" width="190" height="74" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>
<text class="lbl" x="1005" y="111" text-anchor="middle">Realisation log</text>
<text class="sub" x="1005" y="127" text-anchor="middle">C2SP tlog-tiles</text>
<text class="sub" x="1005" y="141" text-anchor="middle">≥2 witness cosigs</text>
<path class="edge" d="M 880 121 L 910 121" marker-end="url(#ah)"/>
<path class="edge" d="M 1005 158 L 1005 190 L 125 190 L 125 214" marker-end="url(#ah)"/>
<rect x="30" y="214" width="190" height="74" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>
<text class="lbl" x="125" y="241" text-anchor="middle">TUF + OCI</text>
<text class="sub" x="125" y="257" text-anchor="middle">targets, snapshot,</text>
<text class="sub" x="125" y="271" text-anchor="middle">timestamp; zstd:chunked</text>
<rect x="250" y="214" width="190" height="74" rx="8" fill="#f3efff" stroke="#6d28d9" stroke-width="1.6"/>
<text class="lbl" x="345" y="241" text-anchor="middle">courier → depot</text>
<text class="sub" x="345" y="257" text-anchor="middle">courier: TUF; depot:</text>
<text class="sub" x="345" y="271" text-anchor="middle">genstmt, proofs, quorum</text>
<path class="edge" d="M 220 251 L 250 251" marker-end="url(#ah)"/>
<rect x="470" y="214" width="190" height="74" rx="8" fill="#e8f7f1" stroke="#047857" stroke-width="1.6"/>
<text class="lbl" x="565" y="241" text-anchor="middle">/store</text>
<text class="sub" x="565" y="257" text-anchor="middle">objects with fs-verity</text>
<text class="sub" x="565" y="271" text-anchor="middle">generation image</text>
<path class="edge" d="M 440 251 L 470 251" marker-end="url(#ah)"/>
<rect x="690" y="214" width="190" height="74" rx="8" fill="#f3efff" stroke="#6d28d9" stroke-width="1.6"/>
<text class="lbl" x="785" y="241" text-anchor="middle">Boot / launch</text>
<text class="sub" x="785" y="257" text-anchor="middle">UKI cmdline digest</text>
<text class="sub" x="785" y="271" text-anchor="middle">or depot.mount</text>
<path class="edge" d="M 660 251 L 690 251" marker-end="url(#ah)"/>
<rect x="910" y="214" width="190" height="74" rx="8" fill="#e5e7eb" stroke="#111827" stroke-width="1.6"/>
<text class="lbl" x="1005" y="241" text-anchor="middle">kl-exec</text>
<text class="sub" x="1005" y="257" text-anchor="middle">exec only from</text>
<text class="sub" x="1005" y="271" text-anchor="middle">verified mounts</text>
<path class="edge" d="M 880 251 L 910 251" marker-end="url(#ah)"/>
<rect class="note" x="30" y="312" width="1070" height="40" rx="4"/>
<text class="notetxt" x="38" y="329">Reproducibility proves bytes = source; it does not prove the source is benign. Source rules (S1–S5) and review cover that gap.</text>
<text class="notetxt" x="38" y="344">Emergency grafts are marked in metadata and replaced by real rebuilds; revocations travel as TUF targets and in the release log.</text>
</svg>

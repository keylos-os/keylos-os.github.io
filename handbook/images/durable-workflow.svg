<text class="lbl" x="1237.6" y="100" text-anchor="middle">ledger</text>
<line class="life" x1="130" y1="116" x2="130" y2="678"/>
<line class="life" x1="393.2" y1="116" x2="393.2" y2="678"/>
<line class="life" x1="698.6" y1="116" x2="698.6" y2="678"/>
<line class="life" x1="848.6" y1="116" x2="848.6" y2="678"/>
<line class="life" x1="1087.6" y1="116" x2="1087.6" y2="678"/>
<line class="life" x1="1237.6" y1="116" x2="1237.6" y2="678"/>
<path class="edge" d="M 134 146 L 389.2 146" marker-end="url(#ah)"/>
<rect class="elblbg" x="141" y="129" width="241.2" height="15" rx="3"/>
<text class="elbl" x="261.6" y="140" text-anchor="middle">Loom.enroll(definition, scope, budgets)</text>

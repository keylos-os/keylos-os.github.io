<text class="lbl" x="393.2" y="100" text-anchor="middle">loom</text>
<rect x="638.6" y="76" width="120" height="40" rx="8" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.6"/>
<text class="lbl" x="698.6" y="100" text-anchor="middle">broker</text>
<rect x="785.7" y="76" width="125.7" height="40" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="848.6" y="100" text-anchor="middle">Attempt worker</text>
<rect x="1027.6" y="76" width="120" height="40" rx="8" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
<text class="lbl" x="1087.6" y="100" text-anchor="middle">gate</text>

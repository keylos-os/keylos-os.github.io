<rect class="elblbg" x="407.2" y="163" width="277.4" height="15" rx="3"/>
<text class="elbl" x="545.9" y="174" text-anchor="middle">BrokerWorkflow.enroll → durable decision dr-…</text>
<path class="edge dash" d="M 694.6 214 L 397.2 214" marker-end="url(#ah)"/>
<rect class="elblbg" x="404.2" y="197" width="283.4" height="15" rx="3"/>
<text class="elbl" x="545.9" y="208" text-anchor="middle">approved: workflow record, budget account ba-…</text>
<path class="edge" d="M 393.2 242 L 433.2 242 L 433.2 260 L 397.2 260" marker-end="url(#ah)"/>
<rect class="elblbg" x="439.2" y="245" width="229.1" height="15" rx="3"/><text class="elbl" x="442.2" y="256">commit claim: epoch e+1, attempt wa-…</text>
<path class="edge" d="M 397.2 292 L 694.6 292" marker-end="url(#ah)"/>
<rect class="elblbg" x="455.4" y="275" width="180.9" height="15" rx="3"/>
<text class="elbl" x="545.9" y="286" text-anchor="middle">BrokerWorkflow.claim(binding)</text>
<path class="edge dash" d="M 694.6 326 L 397.2 326" marker-end="url(#ah)"/>
<rect class="elblbg" x="437.3" y="309" width="217.1" height="15" rx="3"/>
<text class="elbl" x="545.9" y="320" text-anchor="middle">ok; earlier attempts&#x27; roots revoked</text>
<path class="edge" d="M 397.2 360 L 844.6 360" marker-end="url(#ah)"/>
<rect class="elblbg" x="485.2" y="343" width="271.3" height="15" rx="3"/>
<text class="elbl" x="620.9" y="354" text-anchor="middle">spawn with SpawnSpec.attempt (fresh session)</text>
<rect class="note" x="778.6" y="386" width="379.1" height="40" rx="4"/>
<text class="notetxt" x="786.6" y="403">registration: label high-water mark, then fresh tokens</text>
<text class="notetxt" x="786.6" y="418">with workflow(wf, e) and budget_account(ba)</text>
<path class="edge" d="M 844.6 454 L 397.2 454" marker-end="url(#ah)"/>
<rect class="elblbg" x="503.3" y="437" width="235.1" height="15" rx="3"/>
<text class="elbl" x="620.9" y="448" text-anchor="middle">AttemptHost.record / effect / complete</text>

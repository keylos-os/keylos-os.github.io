<rect class="elblbg" x="859.6" y="471" width="217.1" height="15" rx="3"/>
<text class="elbl" x="968.1" y="482" text-anchor="middle">DurableEffects.prepare(fx-…, token)</text>
<path class="edge" d="M 397.2 536 L 1083.6 536" marker-end="url(#ah)"/>
<rect class="elblbg" x="604.7" y="519" width="271.3" height="15" rx="3"/>
<text class="elbl" x="740.4" y="530" text-anchor="middle">DurableEffects.commit(fx-…, current binding)</text>
<path class="edge" d="M 1083.6 570 L 702.6 570" marker-end="url(#ah)"/>
<rect class="elblbg" x="742.3" y="553" width="301.5" height="15" rx="3"/>
<text class="elbl" x="893.1" y="564" text-anchor="middle">authorizeEffect: current policy, durable decision</text>
<path class="edge dash" d="M 1083.6 604 L 397.2 604" marker-end="url(#ah)"/>
<rect class="elblbg" x="631.9" y="587" width="217.1" height="15" rx="3"/>
<text class="elbl" x="740.4" y="598" text-anchor="middle">succeeded | failed | outcomeUnknown</text>
<path class="edge" d="M 397.2 638 L 1233.6 638" marker-end="url(#ah)"/>
<rect class="elblbg" x="697.8" y="621" width="235.1" height="15" rx="3"/>
<text class="elbl" x="815.4" y="632" text-anchor="middle">workflow.* receipts through the outbox</text>
</svg>

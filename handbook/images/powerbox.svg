<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1179 566" width="1179" height="566" role="img" aria-label="Powerbox">
<style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .subtitle { font: 400 12px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .lbl { font: 600 12.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .sub { font: 400 11px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #374151; }
  .mono { font: 400 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2937; }
  .small { font: 400 10.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .grp { fill: none; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .grplbl { font: 600 11.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; letter-spacing: 0.04em; }
  .edge { fill: none; stroke: #374151; stroke-width: 1.4; }
  .edge.dash { stroke-dasharray: 5 4; }
  .elbl { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2937; }
  .elblbg { fill: #ffffff; opacity: 0.92; }
  .life { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 4; }
  .act { fill: #ffffff; stroke: #6b7280; stroke-width: 1; }
  .note { fill: #fffbea; stroke: #d6b656; stroke-width: 1; }
  .notetxt { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4a3b00; }
  .forbid { fill: #b91c1c; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect class="bg" x="0" y="0" width="1179" height="566"/>
<text class="title" x="24" y="34">Powerbox</text>
<text class="subtitle" x="24" y="54">The user&#x27;s choice is the capability</text>
<rect x="70" y="76" width="120" height="40" rx="8" fill="#e6f6f9" stroke="#0e7490" stroke-width="1.6"/>
<text class="lbl" x="130" y="100" text-anchor="middle">App (tier 1)</text>
<rect x="339.2" y="76" width="120" height="40" rx="8" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.6"/>
<text class="lbl" x="399.2" y="100" text-anchor="middle">broker</text>
<rect x="572.2" y="76" width="120" height="40" rx="8" fill="#e6f6f9" stroke="#0e7490" stroke-width="1.6"/>
<text class="lbl" x="632.2" y="100" text-anchor="middle">portal-files</text>
<rect x="851.1" y="76" width="160.6" height="40" rx="8" fill="#e6f6f9" stroke="#0e7490" stroke-width="1.6"/>
<text class="lbl" x="931.4" y="100" text-anchor="middle">atrium (trusted UI)</text>
<rect x="1021.4" y="76" width="120" height="40" rx="8" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.6"/>
<text class="lbl" x="1081.4" y="100" text-anchor="middle">ledger</text>
<line class="life" x1="130" y1="116" x2="130" y2="538"/>
<line class="life" x1="399.2" y1="116" x2="399.2" y2="538"/>
<line class="life" x1="632.2" y1="116" x2="632.2" y2="538"/>
<line class="life" x1="931.4" y1="116" x2="931.4" y2="538"/>
<line class="life" x1="1081.4" y1="116" x2="1081.4" y2="538"/>
<path class="edge" d="M 134 146 L 395.2 146" marker-end="url(#ah)"/>
<rect class="elblbg" x="174.2" y="129" width="180.9" height="15" rx="3"/>
<text class="elbl" x="264.6" y="140" text-anchor="middle">powerbox(openFile, mimeTypes)</text>
<path class="edge" d="M 403.2 180 L 628.2 180" marker-end="url(#ah)"/>
<rect class="elblbg" x="410.2" y="163" width="211" height="15" rx="3"/>
<text class="elbl" x="515.7" y="174" text-anchor="middle">FilePicker.pick (on behalf of app)</text>
<path class="edge" d="M 636.2 214 L 927.4 214" marker-end="url(#ah)"/>
<rect class="elblbg" x="694.4" y="197" width="174.8" height="15" rx="3"/>
<text class="elbl" x="781.8" y="208" text-anchor="middle">show chooser on trusted path</text>
<path class="edge dash" d="M 927.4 248 L 636.2 248" marker-end="url(#ah)"/>
<rect class="elblbg" x="730.5" y="231" width="102.5" height="15" rx="3"/>
<text class="elbl" x="781.8" y="242" text-anchor="middle">user&#x27;s selection</text>
<path class="edge" d="M 632.2 276 L 672.2 276 L 672.2 294 L 636.2 294" marker-end="url(#ah)"/>
<rect class="elblbg" x="678.2" y="279" width="235.1" height="15" rx="3"/><text class="elbl" x="681.2" y="290">openat2(RESOLVE_BENEATH | NO_SYMLINKS)</text>
<path class="edge dash" d="M 628.2 326 L 403.2 326" marker-end="url(#ah)"/>
<rect class="elblbg" x="506.7" y="309" width="18.1" height="15" rx="3"/>
<text class="elbl" x="515.7" y="320" text-anchor="middle">fd</text>
<path class="edge" d="M 399.2 354 L 439.2 354 L 439.2 372 L 403.2 372" marker-end="url(#ah)"/>
<rect class="elblbg" x="445.2" y="357" width="150.7" height="15" rx="3"/><text class="elbl" x="448.2" y="368">mint token for the grant</text>
<path class="edge" d="M 403.2 404 L 1077.4 404" marker-end="url(#ah)"/>
<rect class="elblbg" x="680" y="387" width="120.6" height="15" rx="3"/>
<text class="elbl" x="740.3" y="398" text-anchor="middle">append(grant.issue)</text>
<path class="edge dash" d="M 395.2 438 L 134 438" marker-end="url(#ah)"/>
<rect class="elblbg" x="141" y="421" width="247.2" height="15" rx="3"/>
<text class="elbl" x="264.6" y="432" text-anchor="middle">PowerboxGrant{fd, token, name, viewPath}</text>
<rect class="note" x="60" y="464" width="1091.4" height="40" rx="4"/>
<text class="notetxt" x="68" y="481">Choosing the file is the grant. The app never sees the user&#x27;s home directory.</text>
<text class="notetxt" x="68" y="496">persist=true stores a grant record; tokens are re-minted after reboot.</text>
</svg>

<text class="elbl" x="989.1" y="524" text-anchor="middle">fd · public/untrusted</text>
<rect class="note" x="232.7" y="556" width="903.7" height="40" rx="4"/>
<text class="notetxt" x="240.7" y="573">Writing to the device is the effect media.export (data copied into the VM, which writes it).</text>
<text class="notetxt" x="240.7" y="588">Backup disks with a verified keylos-backup LUKS2 token are the only host mounts.</text>

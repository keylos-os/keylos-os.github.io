<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1298 542" width="1298" height="542" role="img" aria-label="Cluster node (server-k8s)">
<style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .subtitle { font: 400 12px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .lbl { font: 600 12.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .sub { font: 400 11px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #374151; }
  .mono { font: 400 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2937; }
  .small { font: 400 10.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .grp { fill: none; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .grplbl { font: 600 11.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; letter-spacing: 0.04em; }
  .edge { fill: none; stroke: #374151; stroke-width: 1.4; }
  .edge.dash { stroke-dasharray: 5 4; }
  .elbl { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2937; }
  .elblbg { fill: #ffffff; opacity: 0.92; }
  .life { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 4; }
  .act { fill: #ffffff; stroke: #6b7280; stroke-width: 1; }
  .note { fill: #fffbea; stroke: #d6b656; stroke-width: 1; }
  .notetxt { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4a3b00; }
  .forbid { fill: #b91c1c; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect class="bg" x="0" y="0" width="1298" height="542"/>
<text class="title" x="24" y="34">Cluster node (server-k8s)</text>
<text class="subtitle" x="24" y="54">kubelet holds no root; cri does the privileged work through facets; pods run in microVMs by default</text>
<rect class="grp" x="270" y="72" width="760" height="330" rx="12"/><text class="grplbl" x="282" y="89">KEYLOS NODE</text>
<rect x="40" y="100" width="190" height="56" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>
<text class="lbl" x="135" y="125" text-anchor="middle">Control plane</text>
<text class="sub" x="135" y="141" text-anchor="middle">Kubernetes API server</text>
<rect x="300" y="100" width="170" height="56" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="385" y="125" text-anchor="middle">kubelet</text>
<text class="sub" x="385" y="141" text-anchor="middle">t1 · no root, no caps</text>
<rect x="550" y="100" width="210" height="56" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="655" y="118" text-anchor="middle">cri</text>
<text class="sub" x="655" y="134" text-anchor="middle">CRI v1 · admission</text>
<text class="sub" x="655" y="148" text-anchor="middle">netns · volumes · images</text>

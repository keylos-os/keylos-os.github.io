<text class="lbl" x="1175" y="118" text-anchor="middle">fleet</text>
<text class="sub" x="1175" y="134" text-anchor="middle">attestation,</text>
<text class="sub" x="1175" y="148" text-anchor="middle">kubelet certificates</text>

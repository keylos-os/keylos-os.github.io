<rect class="elblbg" x="974" y="67" width="192.9" height="15" rx="3"/>
<text class="elbl" x="1070.5" y="78" text-anchor="middle">joinAttested (AK quote) · certs</text>
<rect x="850" y="196" width="160" height="128" rx="8" fill="#fafafa" stroke="#374151" stroke-width="1.6"/>
<text class="lbl" x="930" y="229" text-anchor="middle">Facets cri uses</text>
<text class="mono" x="930" y="245" text-anchor="middle">depot#cri  images</text>
<text class="mono" x="930" y="259" text-anchor="middle">strata#cri  volumes</text>
<text class="mono" x="930" y="273" text-anchor="middle">net#plumbing  netns</text>
<text class="mono" x="930" y="287" text-anchor="middle">devd#cri  block, VFIO</text>
<text class="mono" x="930" y="301" text-anchor="middle">fleet#cluster  join</text>
<path class="edge" d="M 760 146 L 835 146 L 835 250 L 850 250" marker-end="url(#ah)"/>
<rect class="grp" x="285" y="214" width="255" height="172" rx="12"/><text class="grplbl" x="297" y="231">KEYLOS-VM (DEFAULT)</text>

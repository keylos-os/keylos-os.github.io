<text class="sub" x="475" y="301" text-anchor="middle">purpose pod</text>
<path class="edge" d="M 425 280 L 405 266" marker-end="url(#ah)"/>
<path class="edge" d="M 425 296 L 405 322" marker-end="url(#ah)"/>
<rect class="grp" x="560" y="214" width="260" height="172" rx="12"/><text class="grplbl" x="572" y="231">KEYLOS-SEALED</text>
<rect x="575" y="244" width="115" height="44" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="632.5" y="263" text-anchor="middle">container</text>
<text class="sub" x="632.5" y="279" text-anchor="middle">t1 principal</text>
<rect x="575" y="300" width="115" height="44" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="632.5" y="319" text-anchor="middle">container</text>
<text class="sub" x="632.5" y="335" text-anchor="middle">t1 principal</text>
<rect x="708" y="262" width="100" height="52" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="758" y="285" text-anchor="middle">warden</text>
<text class="sub" x="758" y="301" text-anchor="middle">PodSpawn</text>
<path class="edge" d="M 708 280 L 690 266" marker-end="url(#ah)"/>
<path class="edge" d="M 708 296 L 690 322" marker-end="url(#ah)"/>
<path class="edge" d="M 590 156 L 590 190 L 475 190 L 475 262" marker-end="url(#ah)"/>
<rect class="elblbg" x="499.4" y="173" width="66.3" height="15" rx="3"/>
<text class="elbl" x="532.5" y="184" text-anchor="middle">start(pod)</text>
<path class="edge" d="M 740 156 L 740 262" marker-end="url(#ah)"/>
<text class="small" x="748" y="205" text-anchor="start">spawnContainer</text>
<rect class="note" x="270" y="420" width="760" height="55" rx="4"/>
<text class="notetxt" x="278" y="437">Pod VMs attach tap devices to a bridge in the cri netns: the only tap use in keylos.</text>
<text class="notetxt" x="278" y="452">Default admit forbids: privileged, host namespaces, added capabilities, unconfined seccomp,</text>
<text class="notetxt" x="278" y="467">privilege escalation, hostPath outside the read-only allowlist. Sealed pods need an org-publisher genstmt.</text>
<rect x="40" y="500" width="14" height="14" rx="3" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/><text class="small" x="60" y="511">Execution</text>
<rect x="126.8" y="500" width="14" height="14" rx="3" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.6"/><text class="small" x="146.8" y="511">Authority</text>
<rect x="213.5" y="500" width="14" height="14" rx="3" fill="#fafafa" stroke="#374151" stroke-width="1.6"/><text class="small" x="233.5" y="511">Contracts</text>
<rect x="300.3" y="500" width="14" height="14" rx="3" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/><text class="small" x="320.3" y="511">External</text>
</svg>

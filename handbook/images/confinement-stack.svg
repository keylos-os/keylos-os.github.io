<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1098 506" width="1098" height="506" role="img" aria-label="Confinement stack">
<style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .subtitle { font: 400 12px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .lbl { font: 600 12.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .sub { font: 400 11px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #374151; }
  .mono { font: 400 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2937; }
  .small { font: 400 10.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .grp { fill: none; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .grplbl { font: 600 11.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; letter-spacing: 0.04em; }
  .edge { fill: none; stroke: #374151; stroke-width: 1.4; }
  .edge.dash { stroke-dasharray: 5 4; }
  .elbl { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2937; }
  .elblbg { fill: #ffffff; opacity: 0.92; }
  .life { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 4; }
  .act { fill: #ffffff; stroke: #6b7280; stroke-width: 1; }
  .note { fill: #fffbea; stroke: #d6b656; stroke-width: 1; }
  .notetxt { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4a3b00; }
  .forbid { fill: #b91c1c; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect class="bg" x="0" y="0" width="1098" height="506"/>
<text class="title" x="24" y="34">Confinement stack</text>
<text class="subtitle" x="24" y="54">What stands between a process and the rest of the machine, per tier</text>
<rect x="30" y="80" width="520" height="50" rx="8" fill="#e6f6f9" stroke="#0e7490" stroke-width="1.6"/>
<text class="lbl" x="290" y="102" text-anchor="middle">App process (tier 1)</text>
<text class="sub" x="290" y="118" text-anchor="middle">sealed code only</text>
<rect x="30" y="138" width="520" height="50" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="290" y="160" text-anchor="middle">seccomp allowlist</text>
<text class="sub" x="290" y="176" text-anchor="middle">default ENOSYS; no unshare/setns/io_uring/bpf/mount/ptrace</text>
<rect x="30" y="196" width="520" height="50" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="290" y="218" text-anchor="middle">Landlock domain</text>
<text class="sub" x="290" y="234" text-anchor="middle">deny-all base + mount view + granted fds; scopes signal, abstract unix</text>
<rect x="30" y="254" width="520" height="50" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="290" y="276" text-anchor="middle">Namespaces (no userns)</text>
<text class="sub" x="290" y="292" text-anchor="middle">mnt · pid · ipc · uts · cgroup · net; fresh /proc hidepid</text>
<rect x="30" y="312" width="520" height="50" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="290" y="334" text-anchor="middle">Dynamic UID + cgroup</text>
<text class="sub" x="290" y="350" text-anchor="middle">one principal instance; limits; no supplementary groups</text>
<rect x="30" y="370" width="520" height="50" rx="8" fill="#f3efff" stroke="#6d28d9" stroke-width="1.6"/>
<text class="lbl" x="290" y="392" text-anchor="middle">kl-exec + composefs</text>
<text class="sub" x="290" y="408" text-anchor="middle">exec / mmap-exec only from mounts of verified generations</text>
<rect x="30" y="428" width="520" height="50" rx="8" fill="#e5e7eb" stroke="#111827" stroke-width="1.6"/>
<text class="lbl" x="290" y="450" text-anchor="middle">Host kernel</text>
<text class="sub" x="290" y="466" text-anchor="middle">shared TCB for tiers 0, 1 and legacy</text>
<rect x="600" y="80" width="470" height="50" rx="8" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
<text class="lbl" x="835" y="102" text-anchor="middle">Workbench process (tier 3)</text>
<text class="sub" x="835" y="118" text-anchor="middle">any code, including unsealed</text>
<rect x="600" y="138" width="470" height="50" rx="8" fill="#e5e7eb" stroke="#111827" stroke-width="1.6"/>
<text class="lbl" x="835" y="160" text-anchor="middle">Guest kernel</text>
<text class="sub" x="835" y="176" text-anchor="middle">boundary for in-VM namespaces, containers</text>
<rect x="600" y="196" width="470" height="50" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="835" y="218" text-anchor="middle">virtio devices</text>
<text class="sub" x="835" y="234" text-anchor="middle">virtio-fs shares · virtio-net → bench-net → gate · vsock control · gpu</text>
<rect x="600" y="254" width="470" height="50" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="835" y="276" text-anchor="middle">crosvm</text>
<text class="sub" x="835" y="292" text-anchor="middle">per-device sandboxed processes (tier 0 on host)</text>
<rect x="600" y="312" width="470" height="50" rx="8" fill="#e5e7eb" stroke="#111827" stroke-width="1.6"/>
<text class="lbl" x="835" y="334" text-anchor="middle">KVM</text>
<text class="sub" x="835" y="350" text-anchor="middle">hardware virtualization boundary</text>
<rect class="note" x="600" y="380" width="470" height="40" rx="4"/>
<text class="notetxt" x="608" y="397">A kernel bug reachable from inside a VM compromises</text>
<text class="notetxt" x="608" y="412">only that disposable guest; host exposure is KVM + crosvm.</text>
</svg>

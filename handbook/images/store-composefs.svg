<text class="lbl" x="195" y="239" text-anchor="middle">obj:fsv256:77aa…</text>
<text class="sub" x="195" y="255" text-anchor="middle">fs-verity enabled file, 0444</text>
<rect x="50" y="276" width="290" height="44" rx="8" fill="#e8f7f1" stroke="#047857" stroke-width="1.6"/>
<text class="lbl" x="195" y="295" text-anchor="middle">obj:fsv256:9e1f…</text>
<text class="sub" x="195" y="311" text-anchor="middle">fs-verity enabled file, 0444</text>
<rect x="50" y="332" width="290" height="44" rx="8" fill="#e8f7f1" stroke="#047857" stroke-width="1.6"/>
<text class="lbl" x="195" y="351" text-anchor="middle">obj:fsv256:5b20…</text>
<text class="sub" x="195" y="367" text-anchor="middle">fs-verity enabled file, 0444</text>
<rect class="grp" x="410" y="76" width="340" height="330" rx="12"/><text class="grplbl" x="422" y="93">GENERATION (EROFS IMAGE)</text>
<rect x="430" y="108" width="300" height="64" rx="8" fill="#e8f7f1" stroke="#047857" stroke-width="1.6"/>
<text class="lbl" x="580" y="130" text-anchor="middle">/.keylos/manifest.json</text>
<text class="sub" x="580" y="146" text-anchor="middle">kind, name, version, needs,</text>
<text class="sub" x="580" y="160" text-anchor="middle">tier, effects</text>
<rect x="430" y="186" width="300" height="70" rx="8" fill="#e8f7f1" stroke="#047857" stroke-width="1.6"/>
<text class="lbl" x="580" y="204" text-anchor="middle">metadata tree</text>
<text class="sub" x="580" y="220" text-anchor="middle">paths · modes · owners · xattrs</text>
<text class="sub" x="580" y="234" text-anchor="middle">trusted.overlay.metacopy =</text>
<text class="sub" x="580" y="248" text-anchor="middle">fsv256 of each object</text>
<rect x="430" y="270" width="300" height="56" rx="8" fill="#e8f7f1" stroke="#047857" stroke-width="1.6"/>
<text class="lbl" x="580" y="295" text-anchor="middle">gen:fsv256:&lt;image digest&gt;</text>
<text class="sub" x="580" y="311" text-anchor="middle">= generation ID</text>
<rect x="430" y="340" width="300" height="50" rx="8" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.6"/>
<text class="lbl" x="580" y="362" text-anchor="middle">generation statement</text>
<text class="sub" x="580" y="378" text-anchor="middle">release-stream · publisher · owner-seal</text>
<path class="edge" d="M 430 220 L 340 186" marker-end="url(#ah)"/>
<rect class="elblbg" x="357.9" y="186" width="54.2" height="15" rx="3"/>
<text class="elbl" x="385" y="197" text-anchor="middle">redirect</text>
<path class="edge" d="M 430 230 L 340 300" marker-end="url(#ah)"/>
<rect class="elblbg" x="357.9" y="268" width="54.2" height="15" rx="3"/>
<text class="elbl" x="385" y="279" text-anchor="middle">redirect</text>
<rect class="grp" x="800" y="76" width="300" height="330" rx="12"/><text class="grplbl" x="812" y="93">AT RUNTIME</text>
<rect x="820" y="108" width="260" height="64" rx="8" fill="#f3efff" stroke="#6d28d9" stroke-width="1.6"/>
<text class="lbl" x="950" y="137" text-anchor="middle">OS: digest in signed UKI</text>
<text class="sub" x="950" y="153" text-anchor="middle">cmdline composefs=&lt;gen&gt;</text>
<rect x="820" y="186" width="260" height="64" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="950" y="215" text-anchor="middle">Apps: depot.mount(gen)</text>
<text class="sub" x="950" y="231" text-anchor="middle">fsmount fd → warden view</text>
<rect x="820" y="264" width="260" height="56" rx="8" fill="#e5e7eb" stroke="#111827" stroke-width="1.6"/>
<text class="lbl" x="950" y="289" text-anchor="middle">overlayfs verity=require</text>
<text class="sub" x="950" y="305" text-anchor="middle">checks object digest on open</text>
<rect x="820" y="334" width="260" height="56" rx="8" fill="#e5e7eb" stroke="#111827" stroke-width="1.6"/>
<text class="lbl" x="950" y="359" text-anchor="middle">kl-exec</text>
<text class="sub" x="950" y="375" text-anchor="middle">exec only from registered mounts</text>
<path class="edge" d="M 730 298 L 820 140" marker-end="url(#ah)"/>
<rect class="elblbg" x="729.8" y="202" width="90.4" height="15" rx="3"/>
<text class="elbl" x="775" y="213" text-anchor="middle">trusted digest</text>
<path class="edge" d="M 950 250 L 950 264" marker-end="url(#ah)"/>
<path class="edge" d="M 950 320 L 950 334" marker-end="url(#ah)"/>
</svg>

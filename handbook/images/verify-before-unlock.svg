<line class="life" x1="465.3" y1="116" x2="465.3" y2="615"/>
<line class="life" x1="752.6" y1="116" x2="752.6" y2="615"/>
<line class="life" x1="902.6" y1="116" x2="902.6" y2="615"/>
<line class="life" x1="1052.6" y1="116" x2="1052.6" y2="615"/>
<path class="edge dash" d="M 461.3 146 L 134 146" marker-end="url(#ah)"/>
<rect class="elblbg" x="174.1" y="129" width="247.2" height="15" rx="3"/>
<text class="elbl" x="297.7" y="140" text-anchor="middle">QR1 KLV1 hello: machine key, stream, seq</text>

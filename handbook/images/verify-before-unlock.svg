<rect class="elblbg" x="575.8" y="513" width="66.3" height="15" rx="3"/>
<text class="elbl" x="609" y="524" text-anchor="middle">volume key</text>
<rect class="note" x="60" y="556" width="1062.6" height="25" rx="4"/>
<text class="notetxt" x="68" y="573">Fallback without the app: a 6-digit TOTP sealed to PCR0,2,4,7,11, compared with the phone.</text>

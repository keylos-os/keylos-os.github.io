<rect class="elblbg" x="162" y="265" width="271.3" height="15" rx="3"/>
<text class="elbl" x="297.7" y="276" text-anchor="middle">QR2: quote, PCRs, event-log digest, UKI hash</text>
<path class="edge" d="M 134 316 L 898.6 316" marker-end="url(#ah)"/>
<rect class="elblbg" x="407.8" y="299" width="217.1" height="15" rx="3"/>
<text class="elbl" x="516.3" y="310" text-anchor="middle">release statement for (stream, seq)</text>

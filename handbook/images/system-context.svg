<text class="lbl" x="495" y="126" text-anchor="middle">Experience</text>
<text class="sub" x="495" y="142" text-anchor="middle">kish · atrium · portals</text>
<rect x="285" y="166" width="205" height="50" rx="8" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
<text class="lbl" x="387.5" y="188" text-anchor="middle">Agents &amp; effects</text>
<text class="sub" x="387.5" y="204" text-anchor="middle">aide · gate · net</text>

<rect x="254.6" y="560" width="14" height="14" rx="3" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.6"/><text class="small" x="274.6" y="571">Authority</text>
<rect x="341.3" y="560" width="14" height="14" rx="3" fill="#e8f7f1" stroke="#047857" stroke-width="1.6"/><text class="small" x="361.3" y="571">State</text>
<rect x="404.6" y="560" width="14" height="14" rx="3" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/><text class="small" x="424.6" y="571">Effects and agents</text>
<rect x="544.2" y="560" width="14" height="14" rx="3" fill="#e6f6f9" stroke="#0e7490" stroke-width="1.6"/><text class="small" x="564.2" y="571">Experience</text>
<rect x="636.8" y="560" width="14" height="14" rx="3" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/><text class="small" x="656.8" y="571">External</text>
<rect x="717.7" y="560" width="14" height="14" rx="3" fill="#fdecf3" stroke="#9d174d" stroke-width="1.6"/><text class="small" x="737.7" y="571">Human</text>

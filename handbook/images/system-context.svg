<text class="small" x="285" y="490" text-anchor="start">all components speak capwire (protocols); no system bus</text>
<rect x="790" y="90" width="220" height="58" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>

<text class="sub" x="495" y="390" text-anchor="middle">boot · courier  (UKI, TPM2, composefs, kl-exec)</text>
<rect x="285" y="414" width="420" height="44" rx="8" fill="#e5e7eb" stroke="#111827" stroke-width="1.6"/>

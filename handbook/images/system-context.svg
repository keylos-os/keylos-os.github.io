<text class="lbl" x="900" y="350" text-anchor="middle">App publishers</text>
<text class="sub" x="900" y="366" text-anchor="middle">signed generations</text>
<rect x="790" y="402" width="220" height="58" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>
<text class="lbl" x="900" y="421" text-anchor="middle">Third-party hosts</text>
<text class="sub" x="900" y="437" text-anchor="middle">APIs, mail, git forges,</text>
<text class="sub" x="900" y="451" text-anchor="middle">model providers</text>
<rect x="790" y="480" width="220" height="50" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>
<text class="lbl" x="900" y="502" text-anchor="middle">fleet (optional)</text>
<text class="sub" x="900" y="518" text-anchor="middle">org policy, attestation</text>

<text class="lbl" x="900" y="194" text-anchor="middle">Rebuilders (k-of-n)</text>
<text class="sub" x="900" y="210" text-anchor="middle">independent operators</text>
<rect x="790" y="246" width="220" height="58" rx="8" fill="#f1f2f4" stroke="#4b5563" stroke-width="1.6"/>
<text class="lbl" x="900" y="265" text-anchor="middle">Transparency logs</text>
<text class="sub" x="900" y="281" text-anchor="middle">realisations · releases</text>
<text class="sub" x="900" y="295" text-anchor="middle">C2SP tiles + witnesses</text>

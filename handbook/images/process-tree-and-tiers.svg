<text class="sub" x="940" y="312" text-anchor="middle">untrusted apps</text>
<rect x="590" y="340" width="460" height="52" rx="8" fill="#e5e7eb" stroke="#111827" stroke-width="1.6"/>
<text class="lbl" x="820" y="363" text-anchor="middle">guest kernels</text>
<text class="sub" x="820" y="379" text-anchor="middle">unsealed code runs only here</text>
<path class="edge" d="M 550 124 L 290 150" marker-end="url(#ah)"/>
<path class="edge" d="M 550 124 L 820 150" marker-end="url(#ah)"/>
<rect class="note" x="30" y="430" width="1040" height="40" rx="4"/>
<text class="notetxt" x="38" y="447">Tier 0/1/legacy: same host kernel, kl-exec enforced, Landlock + seccomp + namespaces (no userns except legacy).</text>
<text class="notetxt" x="38" y="462">Tier 2/3: separate guest kernel inside a microVM; the host sees only crosvm device processes, themselves confined.</text>
</svg>

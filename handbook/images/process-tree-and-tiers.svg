<text class="sub" x="700" y="298" text-anchor="middle">crosvm workbench VMs</text>
<text class="sub" x="700" y="312" text-anchor="middle">dev envs · agent sessions</text>
<rect x="830" y="262" width="220" height="60" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="940" y="282" text-anchor="middle">app VMs (tier 2)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1108 533" width="1108" height="533" role="img" aria-label="Labels and the Rule of Two">
<style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .subtitle { font: 400 12px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .lbl { font: 600 12.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .sub { font: 400 11px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #374151; }
  .mono { font: 400 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2937; }
  .small { font: 400 10.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .grp { fill: none; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .grplbl { font: 600 11.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; letter-spacing: 0.04em; }
  .edge { fill: none; stroke: #374151; stroke-width: 1.4; }
  .edge.dash { stroke-dasharray: 5 4; }
  .elbl { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2937; }
  .elblbg { fill: #ffffff; opacity: 0.92; }
  .life { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 4; }
  .act { fill: #ffffff; stroke: #6b7280; stroke-width: 1; }
  .note { fill: #fffbea; stroke: #d6b656; stroke-width: 1; }
  .notetxt { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4a3b00; }
  .forbid { fill: #b91c1c; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect class="bg" x="0" y="0" width="1108" height="533"/>
<text class="title" x="24" y="34">Labels and the Rule of Two</text>
<text class="subtitle" x="24" y="54">A session may hold at most two of U, P and X; the third requires declassification at T3</text>
<circle cx="245" cy="230" r="130" fill="#fdf3e4" fill-opacity="0.55" stroke="#b45309" stroke-width="1.6"/>
<circle cx="415" cy="230" r="130" fill="#fdeeee" fill-opacity="0.55" stroke="#b91c1c" stroke-width="1.6"/>
<circle cx="330" cy="375" r="130" fill="#e8f7f1" fill-opacity="0.55" stroke="#047857" stroke-width="1.6"/>
<text class="lbl" x="155" y="180" text-anchor="start">U  integ = untrusted</text>
<text class="lbl" x="405" y="180" text-anchor="start">P  conf ≥ private</text>
<text class="lbl" x="205" y="440" text-anchor="start">X  commit / effect / non-sink-safe egress</text>
<circle cx="330" cy="282" r="26" class="forbid"/><text class="lbl" x="330" y="287" text-anchor="middle" fill="#fff" style="fill:#fff">T3</text>
<rect x="620" y="90" width="460" height="120" rx="8" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.6"/>
<text class="lbl" x="850" y="126" text-anchor="middle">Label lattice</text>
<text class="sub" x="850" y="142" text-anchor="middle">conf: public &lt; internal &lt; private &lt; secret</text>
<text class="sub" x="850" y="156" text-anchor="middle">integ: trusted &lt; user &lt; untrusted</text>
<text class="sub" x="850" y="170" text-anchor="middle">session label = max over everything read</text>
<text class="sub" x="850" y="184" text-anchor="middle">labels never decrease within a session</text>
<rect x="620" y="230" width="460" height="100" rx="8" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.6"/>
<text class="lbl" x="850" y="263" text-anchor="middle">Declassification</text>
<text class="sub" x="850" y="279" text-anchor="middle">human approval of the rendered effect (T3), or</text>
<text class="sub" x="850" y="293" text-anchor="middle">a policy-trusted flow proof (camel/1)</text>
<text class="sub" x="850" y="307" text-anchor="middle">from the agent harness</text>
<rect x="620" y="350" width="460" height="90" rx="8" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
<text class="lbl" x="850" y="385" text-anchor="middle">Enforcement points</text>
<text class="sub" x="850" y="401" text-anchor="middle">broker: request / materialize / delegate</text>
<text class="sub" x="850" y="415" text-anchor="middle">gate: connect / stage / commit</text>
</svg>

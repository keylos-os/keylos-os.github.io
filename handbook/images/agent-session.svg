<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 888" width="1340" height="888" role="img" aria-label="Agent session">
<style>
  .bg { fill: #ffffff; }
  .title { font: 600 18px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .subtitle { font: 400 12px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .lbl { font: 600 12.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111827; }
  .sub { font: 400 11px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #374151; }
  .mono { font: 400 11px 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; fill: #1f2937; }
  .small { font: 400 10.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; }
  .grp { fill: none; stroke: #9ca3af; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .grplbl { font: 600 11.5px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4b5563; letter-spacing: 0.04em; }
  .edge { fill: none; stroke: #374151; stroke-width: 1.4; }
  .edge.dash { stroke-dasharray: 5 4; }
  .elbl { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2937; }
  .elblbg { fill: #ffffff; opacity: 0.92; }
  .life { stroke: #9ca3af; stroke-width: 1; stroke-dasharray: 3 4; }
  .act { fill: #ffffff; stroke: #6b7280; stroke-width: 1; }
  .note { fill: #fffbea; stroke: #d6b656; stroke-width: 1; }
  .notetxt { font: 400 10.8px Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #4a3b00; }
  .forbid { fill: #b91c1c; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker></defs>
<rect class="bg" x="0" y="0" width="1340" height="888"/>
<text class="title" x="24" y="34">Agent session</text>
<text class="subtitle" x="24" y="54">Fix a bug and open a pull request</text>
<rect x="70" y="76" width="120" height="40" rx="8" fill="#fdecf3" stroke="#9d174d" stroke-width="1.6"/>
<text class="lbl" x="130" y="100" text-anchor="middle">Human</text>
<rect x="303" y="76" width="120" height="40" rx="8" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
<text class="lbl" x="363" y="100" text-anchor="middle">aide</text>
<rect x="518" y="76" width="120" height="40" rx="8" fill="#fdeeee" stroke="#b91c1c" stroke-width="1.6"/>
<text class="lbl" x="578" y="100" text-anchor="middle">broker</text>
<rect x="668" y="76" width="120" height="40" rx="8" fill="#eaf1ff" stroke="#1d4ed8" stroke-width="1.6"/>
<text class="lbl" x="728" y="100" text-anchor="middle">bench (VM)</text>
<rect x="818" y="76" width="120" height="40" rx="8" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
<text class="lbl" x="878" y="100" text-anchor="middle">harness in VM</text>
<rect x="968" y="76" width="120" height="40" rx="8" fill="#fdf3e4" stroke="#b45309" stroke-width="1.6"/>
<text class="lbl" x="1028" y="100" text-anchor="middle">gate</text>
<rect x="1182.7" y="76" width="120" height="40" rx="8" fill="#e8f7f1" stroke="#047857" stroke-width="1.6"/>
<text class="lbl" x="1242.7" y="100" text-anchor="middle">strata</text>
<line class="life" x1="130" y1="116" x2="130" y2="860"/>
<line class="life" x1="363" y1="116" x2="363" y2="860"/>
<line class="life" x1="578" y1="116" x2="578" y2="860"/>
<line class="life" x1="728" y1="116" x2="728" y2="860"/>
<line class="life" x1="878" y1="116" x2="878" y2="860"/>
<line class="life" x1="1028" y1="116" x2="1028" y2="860"/>
<line class="life" x1="1242.7" y1="116" x2="1242.7" y2="860"/>
<path class="edge" d="M 134 146 L 359 146" marker-end="url(#ah)"/>
<rect class="elblbg" x="141" y="129" width="211" height="15" rx="3"/>
<text class="elbl" x="246.5" y="140" text-anchor="middle">start(SessionSpec{template, task})</text>
<path class="edge" d="M 367 180 L 574 180" marker-end="url(#ah)"/>
<rect class="elblbg" x="374" y="163" width="192.9" height="15" rx="3"/>
<text class="elbl" x="470.5" y="174" text-anchor="middle">delegate(tokens, child session)</text>
<path class="edge dash" d="M 574 214 L 367 214" marker-end="url(#ah)"/>
<rect class="elblbg" x="416.2" y="197" width="108.5" height="15" rx="3"/>
<text class="elbl" x="470.5" y="208" text-anchor="middle">attenuated tokens</text>
<path class="edge" d="M 367 248 L 724 248" marker-end="url(#ah)"/>
<rect class="elblbg" x="455.1" y="231" width="180.9" height="15" rx="3"/>
<text class="elbl" x="545.5" y="242" text-anchor="middle">start(VmSpec{overlay shares})</text>
<path class="edge" d="M 732 282 L 874 282" marker-end="url(#ah)"/>
<rect class="elblbg" x="745.7" y="265" width="114.5" height="15" rx="3"/>
<text class="elbl" x="803" y="276" text-anchor="middle">boot from snapshot</text>
<path class="edge" d="M 874 316 L 367 316" marker-end="url(#ah)"/>
<rect class="elblbg" x="533.1" y="299" width="174.8" height="15" rx="3"/>
<text class="elbl" x="620.5" y="310" text-anchor="middle">AgentHost.model (vsock 7002)</text>
<path class="edge" d="M 367 350 L 1024 350" marker-end="url(#ah)"/>
<rect class="elblbg" x="611.1" y="333" width="168.8" height="15" rx="3"/>
<text class="elbl" x="695.5" y="344" text-anchor="middle">charge + proxied model call</text>
<path class="edge" d="M 874 384 L 367 384" marker-end="url(#ah)"/>
<rect class="elblbg" x="554.2" y="367" width="132.6" height="15" rx="3"/>
<text class="elbl" x="620.5" y="378" text-anchor="middle">callTool(edit, test…)</text>
<rect class="note" x="658" y="410" width="290" height="40" rx="4"/>
<text class="notetxt" x="666" y="427">edits land in the overlay fork;</text>
<text class="notetxt" x="666" y="442">tests run inside the guest</text>
<path class="edge" d="M 874 478 L 367 478" marker-end="url(#ah)"/>
<rect class="elblbg" x="521" y="461" width="199" height="15" rx="3"/>
<text class="elbl" x="620.5" y="472" text-anchor="middle">keylos.effect.stage(git.pr.open)</text>
<path class="edge" d="M 367 512 L 1024 512" marker-end="url(#ah)"/>
<rect class="elblbg" x="614.1" y="495" width="162.8" height="15" rx="3"/>
<text class="elbl" x="695.5" y="506" text-anchor="middle">stage(intent) (facet aide)</text>
<path class="edge dash" d="M 359 546 L 134 546" marker-end="url(#ah)"/>
<rect class="elblbg" x="171.1" y="529" width="150.7" height="15" rx="3"/>
<text class="elbl" x="246.5" y="540" text-anchor="middle">event: finished, changes</text>
<path class="edge" d="M 134 580 L 359 580" marker-end="url(#ah)"/>
<rect class="elblbg" x="219.4" y="563" width="54.2" height="15" rx="3"/>
<text class="elbl" x="246.5" y="574" text-anchor="middle">review()</text>
<path class="edge" d="M 367 614 L 724 614" marker-end="url(#ah)"/>
<rect class="elblbg" x="452" y="597" width="186.9" height="15" rx="3"/>
<text class="elbl" x="545.5" y="608" text-anchor="middle">BenchMerge.manifest → fs.merge</text>
<path class="edge" d="M 1024 648 L 582 648" marker-end="url(#ah)"/>
<rect class="elblbg" x="724.6" y="631" width="156.8" height="15" rx="3"/>
<text class="elbl" x="803" y="642" text-anchor="middle">requestFor (T3) → mandate</text>
<path class="edge" d="M 1024 682 L 732 682" marker-end="url(#ah)"/>
<rect class="elblbg" x="808.6" y="665" width="138.7" height="15" rx="3"/>
<text class="elbl" x="878" y="676" text-anchor="middle">BenchMerge.commitShare</text>
<path class="edge" d="M 732 716 L 1238.7 716" marker-end="url(#ah)"/>
<rect class="elblbg" x="928" y="699" width="114.5" height="15" rx="3"/>
<text class="elbl" x="985.3" y="710" text-anchor="middle">transaction commit</text>
<path class="edge" d="M 1028 744 L 1068 744 L 1068 762 L 1032 762" marker-end="url(#ah)"/>
<rect class="elblbg" x="1074" y="747" width="150.7" height="15" rx="3"/><text class="elbl" x="1077" y="758">commit intents (mandate)</text>
<rect class="note" x="60" y="786" width="1252.7" height="40" rx="4"/>
<text class="notetxt" x="68" y="803">Every step above writes a receipt to ledger (agent.start, grant.delegate, budget.charge,</text>
<text class="notetxt" x="68" y="818">effect.stage, approval.decide, txn.commit, effect.commit, agent.merge).</text>
</svg>
